# Minor and patch updates arrive as grouped weekly PRs. Major upgrades
# (including moving off the Node LTS line) are done deliberately in their own
# branch, so Dependabot does not raise them.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # Prisma 6.13 to 7.10 depend on a vulnerable deepmerge-ts.
      - dependency-name: prisma
        versions: ['>=6.13.0 <7.11.0']
      - dependency-name: '@prisma/client'
        versions: ['>=6.13.0 <7.11.0']
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
    ignore:
      # Stay on Node 22 LTS.
      - dependency-name: node
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
