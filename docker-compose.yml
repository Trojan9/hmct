# Runs the whole stack: PostgreSQL, the API and the web app.
#   docker compose up --build
# Web app:  http://localhost:8080
# API docs: http://localhost:3001/api-docs
name: hmcts-tasks

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: tasks
      POSTGRES_DB: tasks
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tasks -d tasks']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://tasks:tasks@db:5432/tasks?schema=public
      CORS_ORIGIN: http://localhost:8080,http://localhost:5173
      SEED_DEMO_DATA: 'true'
    ports:
      - '3001:3001'
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - '8080:8080'
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
