# Serves the built single-page app and proxies API calls to the api service,
# so the browser only ever talks to one origin (no CORS needed in production).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  server_tokens off;
  client_max_body_size 100k;

  location ~ ^/(api|api-docs|health)(/|$) {
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed build assets never change, so cache them for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/conf.d/security-headers.inc;
  }

  # Everything else is a client-side route: serve index.html, never cached.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/conf.d/security-headers.inc;
  }
}
